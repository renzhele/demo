<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>编程题分析助手</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: system-ui, -apple-system, Segoe UI, "Microsoft YaHei", sans-serif;
        margin: 0; padding: 1.5rem;
        background: #f5f6fa; color: #222;
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }
      h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
      .subtitle { color: #6b7280; font-size: 0.875rem; margin: 0 0 1rem; }
      textarea {
        width: 100%; padding: 0.6rem;
        font-family: inherit;
        border: 1px solid #d1d5db; border-radius: 6px;
        resize: vertical; background: #fff;
      }
      /* Markdown：失焦预览，聚焦编辑 */
      .md-shell {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 160px;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .md-shell textarea {
        width: 100%;
        margin: 0;
        padding: 0.6rem;
        font-family: ui-monospace, "Cascadia Code", Consolas, "Microsoft YaHei", monospace;
        font-size: 0.9rem;
        line-height: 1.5;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #fff;
        resize: none;
        flex: 1 1 auto;
        min-height: 160px;
        height: 100%;
      }
      .hint-block .md-shell textarea {
        font-family: inherit;
        font-size: 0.8rem;
      }
      .md-shell:not(.is-edit) textarea {
        position: absolute;
        inset: 0;
        opacity: 0;
        z-index: 0;
        pointer-events: none;
        height: 100%;
        min-height: 160px;
      }
      .md-shell.is-edit textarea {
        position: relative;
        opacity: 1;
        z-index: 2;
        pointer-events: auto;
      }
      .md-preview {
        flex: 1 1 auto;
        min-height: 160px;
        overflow: auto;
        padding: 0.6rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #fff;
        cursor: text;
        font-size: 0.9rem;
        line-height: 1.55;
        color: #222;
        position: relative;
        z-index: 1;
      }
      .hint-block .md-preview {
        font-size: 0.8rem;
        background: #fafafa;
        border-color: #e8e8ed;
      }
      .md-shell.is-edit .md-preview {
        display: none;
      }
      .md-preview-placeholder {
        color: #9ca3af;
        font-size: 0.875rem;
        margin: 0;
      }
      .md-preview :first-child { margin-top: 0; }
      .md-preview :last-child { margin-bottom: 0; }
      .md-preview h1 { font-size: 1.15rem; margin: 0.75rem 0 0.4rem; font-weight: 700; }
      .md-preview h2 { font-size: 1.05rem; margin: 0.65rem 0 0.35rem; font-weight: 650; }
      .md-preview h3 { font-size: 0.95rem; margin: 0.5rem 0 0.3rem; font-weight: 600; }
      .md-preview p { margin: 0.45rem 0; }
      .md-preview ul, .md-preview ol { margin: 0.45rem 0; padding-left: 1.35rem; }
      .md-preview code {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.84em;
        background: #f3f4f6;
        padding: 0.12em 0.35em;
        border-radius: 4px;
      }
      .md-preview pre {
        margin: 0.5rem 0;
        padding: 0.55rem 0.65rem;
        background: #1e293b;
        color: #e2e8f0;
        border-radius: 6px;
        overflow: auto;
        font-size: 0.8rem;
      }
      .md-preview pre code {
        background: none;
        padding: 0;
        color: inherit;
      }
      .md-preview blockquote {
        margin: 0.45rem 0;
        padding-left: 0.75rem;
        border-left: 3px solid #cbd5e1;
        color: #64748b;
      }
      .md-preview table { border-collapse: collapse; width: 100%; font-size: 0.88rem; margin: 0.5rem 0; }
      .md-preview th, .md-preview td { border: 1px solid #e5e7eb; padding: 0.35rem 0.5rem; }
      .md-preview th { background: #f9fafb; }
      .app-main {
        --top-pane-height: 420px;
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
        margin-top: 0.25rem;
      }
      .pane-top {
        flex: 0 0 var(--top-pane-height, 420px);
        display: flex;
        flex-direction: column;
        min-height: 200px;
        max-height: min(78vh, 920px);
        overflow: hidden;
      }
      .input-row {
        display: flex;
        flex-wrap: nowrap;
        align-items: stretch;
        flex: 1 1 auto;
        min-height: 0;
        gap: 0;
        margin-bottom: 0.75rem;
      }
      @media (max-width: 720px) {
        .input-row { flex-direction: column; flex-wrap: wrap; }
      }
      .doc-block,
      .hint-block {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .doc-block {
        flex: 1 1 0;
        padding: 0.5rem 0.65rem;
        min-width: 180px;
      }
      .hint-block {
        flex: 0 0 var(--hint-width, clamp(280px, 32%, 420px));
        padding: 0.5rem 0.65rem;
        background: #fafafa;
        border: 1px solid #e8e8ed;
        border-radius: 8px;
        min-width: 200px;
      }
      @media (max-width: 720px) {
        .hint-block {
          flex: 1 1 auto;
          width: 100%;
          max-width: none;
          min-width: 0;
        }
      }
      .splitter {
        flex-shrink: 0;
        background: #e5e7eb;
        transition: background 0.15s ease;
        position: relative;
        z-index: 1;
        touch-action: none;
      }
      .splitter:hover,
      .splitter.is-dragging {
        background: #93c5fd;
      }
      .splitter-v {
        width: 8px;
        cursor: col-resize;
        margin: 0 2px;
        border-radius: 4px;
      }
      .splitter-h {
        height: 10px;
        cursor: row-resize;
        margin: 4px 0;
        border-radius: 4px;
        flex: 0 0 auto;
      }
      @media (max-width: 720px) {
        .splitter-v.splitter-input,
        .splitter-h.splitter-main { display: none; }
      }
      .block-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: #374151;
        line-height: 1.25;
        margin: 0 0 0.35rem 0;
        flex-shrink: 0;
      }
      .hint-block .block-label {
        color: #4b5563;
      }
      /* 输入区高度由 .md-shell 承担 */
      .doc-block .md-shell,
      .hint-block .md-shell {
        flex: 1 1 auto;
        min-height: 160px;
        height: 100%;
      }
      .hint-block .hint-desc {
        font-size: 0.72rem;
        color: #6b7280;
        font-weight: 400;
        line-height: 1.35;
        margin: 0.4rem 0 0 0;
        flex-shrink: 0;
      }
      .toolbar { display: flex; gap: 0.75rem; align-items: center; margin: 0 0 1.2rem; }
      button {
        padding: 0.45rem 1.1rem; border: none; border-radius: 5px;
        cursor: pointer; font-size: 0.9rem; font-weight: 500;
      }
      #btn-analyze { background: #2563eb; color: #fff; }
      #btn-analyze:disabled { background: #93c5fd; cursor: not-allowed; }

      .pane-bottom {
        flex: 1 1 auto;
        min-height: 160px;
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }
      .results {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        flex: 1 1 auto;
        min-height: 0;
        gap: 0;
        overflow: auto;
      }
      .result-col[data-i="0"] {
        flex: var(--col0-flex, 1) 1 0;
        min-width: 160px;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .result-col[data-i="1"] {
        flex: var(--col1-flex, 1) 1 0;
        min-width: 160px;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .result-col[data-i="2"] {
        flex: var(--col2-flex, 1) 1 0;
        min-width: 160px;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      @media (max-width: 960px) {
        .results { flex-direction: column; }
        .splitter-v.splitter-results { display: none; }
        .result-col[data-i="0"],
        .result-col[data-i="1"],
        .result-col[data-i="2"] {
          flex: 1 1 auto !important;
          min-width: 0;
        }
      }

      .card {
        background: #fff; border-radius: 8px;
        border: 1px solid #e5e7eb; padding: 1rem;
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
      }
      .card h2 { font-size: 1rem; margin: 0 0 0.75rem; display: flex; align-items: center; gap: 0.4rem; }
      .card h2 .badge {
        font-size: 0.7rem; padding: 0.1rem 0.45rem;
        border-radius: 99px; font-weight: 600;
      }
      .req-badge { background: #dbeafe; color: #1d4ed8; }
      .fac-badge { background: #dcfce7; color: #15803d; }
      .chal-badge { background: #fef3c7; color: #b45309; }

      /* 需求点 */
      .req-item { margin-bottom: 0.65rem; }
      .req-category {
        font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em;
        text-transform: uppercase; color: #6b7280; margin-bottom: 0.15rem;
      }
      .req-summary { font-size: 0.88rem; line-height: 1.5; }

      /* 测试因子 */
      .factor-item {
        display: flex; align-items: flex-start; gap: 0.5rem;
        padding: 0.3rem 0; border-bottom: 1px solid #f3f4f6;
        font-size: 0.88rem;
      }
      .factor-item:last-child { border-bottom: none; }
      .factor-item input[type="checkbox"] { margin-top: 0.15rem; flex-shrink: 0; }
      .factor-item span.done { text-decoration: line-through; color: #9ca3af; }

      /* 关键难点 */
      .challenge-item {
        display: flex; gap: 0.65rem; align-items: flex-start;
        padding: 0.55rem 0; border-bottom: 1px solid #f3f4f6;
        font-size: 0.88rem; line-height: 1.55;
      }
      .challenge-item:last-child { border-bottom: none; }
      .challenge-num {
        flex-shrink: 0; width: 1.5rem; height: 1.5rem;
        border-radius: 6px; background: #fff7ed; color: #c2410c;
        font-size: 0.75rem; font-weight: 700; display: flex;
        align-items: center; justify-content: center;
      }

      .empty { color: #9ca3af; font-size: 0.875rem; }
      .status { font-size: 0.85rem; color: #6b7280; margin-bottom: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>需求分析助手</h1>
    <p class="subtitle">粘贴需求文档，自动理解需求结构、提取测试因子与关键难点，辅助用例设计。需求与提示框支持 Markdown：点击预览区或聚焦输入框进入编辑，失焦后显示预览。灰条可拖动调整布局。</p>

    <div class="app-main" id="app-main">
      <div class="pane-top" id="pane-top">
        <div class="input-row" id="input-row" style="--hint-width: 340px;">
          <div class="doc-block">
            <label for="text" class="block-label">需求内容（Markdown）</label>
            <div class="md-shell" data-md-shell>
              <textarea id="text" placeholder="粘贴需求文档内容...
例如：
用户上传头像，文件格式支持 jpg/png，大小不超过 2MB。
未登录用户访问个人中心时，自动跳转至登录页。
每个用户每天最多发送 10 条消息，超出后提示限额。"></textarea>
              <div class="md-preview" aria-hidden="true"></div>
            </div>
          </div>
          <div class="splitter splitter-v splitter-input" id="split-doc-hint" role="separator" aria-orientation="vertical" title="左右拖动：需求 / 提示"></div>
          <aside class="hint-block" id="hint-block">
            <label for="hint" class="block-label">提示（Markdown）</label>
            <div class="md-shell" data-md-shell>
              <textarea id="hint" placeholder="例如：电商下单场景；「用户」指已实名 C 端买家；需兼容 iOS/Android。"></textarea>
              <div class="md-preview" aria-hidden="true"></div>
            </div>
            <p class="hint-desc">可选。补充背景、术语或需关注的点，便于模型理解。</p>
          </aside>
        </div>
        <div class="toolbar">
          <button id="btn-analyze">分析需求</button>
        </div>
      </div>

      <div class="splitter splitter-h splitter-main" id="split-main" role="separator" aria-orientation="horizontal" title="上下拖动：输入区 / 结果区"></div>

      <div class="pane-bottom" id="pane-bottom">
        <div class="results" id="results-row" style="--col0-flex: 1; --col1-flex: 1; --col2-flex: 1;">
          <div class="result-col" data-i="0">
            <div class="card" id="card-req">
              <h2>📋 需求重述 <span class="badge req-badge" id="req-count"></span></h2>
              <div id="req-content"><p class="empty">点击「分析需求」后，此处显示结构化需求重述。</p></div>
            </div>
          </div>
          <div class="splitter splitter-v splitter-results" data-pair="01" role="separator" aria-orientation="vertical" title="左右拖动列宽"></div>
          <div class="result-col" data-i="1">
            <div class="card" id="card-chal">
              <h2>⚠️ 关键难点 <span class="badge chal-badge" id="chal-count"></span></h2>
              <div id="chal-content"><p class="empty">点击「分析需求」后，此处显示从需求中提炼的关键难点（通常为 2 条）。</p></div>
            </div>
          </div>
          <div class="splitter splitter-v splitter-results" data-pair="12" role="separator" aria-orientation="vertical" title="左右拖动列宽"></div>
          <div class="result-col" data-i="2">
            <div class="card" id="card-fac">
              <h2>🔍 提取测试因子 <span class="badge fac-badge" id="fac-count"></span></h2>
              <div id="fac-content"><p class="empty">点击「分析需求」后，此处显示测试因子列表，可勾选已设计用例。</p></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" crossorigin="anonymous"></script>
    <script>
      const $ = id => document.getElementById(id);
      let mdMarkedConfigured = false;

      function escHtmlPlain(s) {
        return String(s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function initMdShell(shell) {
        const ta = shell.querySelector('textarea');
        const preview = shell.querySelector('.md-preview');
        if (!ta || !preview) return;

        function toHtml(src) {
          const t = src.trim();
          if (!t) {
            const line = (ta.getAttribute('placeholder') || '').split('\n')[0] || '（空）';
            return `<p class="md-preview-placeholder">${escHtmlPlain(line)}</p>`;
          }
          if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
            if (!mdMarkedConfigured) {
              marked.setOptions({ breaks: true, gfm: true });
              mdMarkedConfigured = true;
            }
            return DOMPurify.sanitize(marked.parse(t));
          }
          return `<p class="md-plain">${escHtmlPlain(t).replace(/\n/g, '<br>')}</p>`;
        }

        function refreshPreview() {
          preview.innerHTML = toHtml(ta.value);
        }

        function leaveEdit() {
          shell.classList.remove('is-edit');
          preview.removeAttribute('aria-hidden');
          refreshPreview();
        }

        ta.addEventListener('focus', () => {
          shell.classList.add('is-edit');
          preview.setAttribute('aria-hidden', 'true');
        });

        ta.addEventListener('blur', () => {
          setTimeout(() => {
            if (!shell.contains(document.activeElement)) {
              leaveEdit();
            }
          }, 0);
        });

        preview.addEventListener('mousedown', e => {
          if (e.button !== 0) return;
          e.preventDefault();
          ta.focus();
        });

        leaveEdit();
      }
      const LAYOUT_KEY = 'reqAnalyzer.splitLayout';

      function readLayout() {
        try {
          const raw = localStorage.getItem(LAYOUT_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch {
          return {};
        }
      }

      function writeLayout(patch) {
        const cur = readLayout();
        Object.assign(cur, patch);
        try {
          localStorage.setItem(LAYOUT_KEY, JSON.stringify(cur));
        } catch (_) { /* ignore quota */ }
      }

      function applyLayout() {
        const L = readLayout();
        const app = $('app-main');
        const row = $('input-row');
        const results = $('results-row');
        if (L.topPanePx && app) {
          app.style.setProperty('--top-pane-height', `${L.topPanePx}px`);
        }
        if (L.hintPx && row) {
          row.style.setProperty('--hint-width', `${L.hintPx}px`);
        }
        if (Array.isArray(L.cols) && L.cols.length === 3 && results) {
          results.style.setProperty('--col0-flex', String(L.cols[0]));
          results.style.setProperty('--col1-flex', String(L.cols[1]));
          results.style.setProperty('--col2-flex', String(L.cols[2]));
        }
      }

      function parseFlexVar(el, name, fallback) {
        const v = parseFloat(getComputedStyle(el).getPropertyValue(name));
        return Number.isFinite(v) ? v : fallback;
      }

      function bindSplitterDrag({ el, onDrag, onCommit, onStart }) {
        if (!el) return;
        let active = false;
        let startX = 0;
        let startY = 0;
        let ctx = null;

        el.addEventListener('pointerdown', e => {
          if (e.button !== 0) return;
          e.preventDefault();
          active = true;
          el.classList.add('is-dragging');
          document.body.style.userSelect = 'none';
          startX = e.clientX;
          startY = e.clientY;
          ctx = onStart ? onStart(e) : null;
          try {
            el.setPointerCapture(e.pointerId);
          } catch (_) { /* noop */ }
        });

        el.addEventListener('pointermove', e => {
          if (!active) return;
          onDrag(e.clientX - startX, e.clientY - startY, e, ctx);
        });

        const end = e => {
          if (!active) return;
          active = false;
          ctx = null;
          el.classList.remove('is-dragging');
          document.body.style.userSelect = '';
          try {
            if (e && e.pointerId != null) el.releasePointerCapture(e.pointerId);
          } catch (_) { /* noop */ }
          onCommit && onCommit();
        };

        el.addEventListener('pointerup', end);
        el.addEventListener('pointercancel', end);
      }

      function setupResizableLayout() {
        applyLayout();

        const row = $('input-row');
        const hintBlock = $('hint-block');
        const splitDocHint = $('split-doc-hint');
        bindSplitterDrag({
          el: splitDocHint,
          onStart: () => ({ hintW: hintBlock.getBoundingClientRect().width }),
          onDrag: (dx, _dy, _e, c) => {
            if (window.innerWidth <= 720 || !c) return;
            const rowW = row.getBoundingClientRect().width;
            const docMin = 180;
            const hintMin = 200;
            const gutter = 14;
            const w = Math.max(
              hintMin,
              Math.min(c.hintW - dx, rowW - docMin - gutter),
            );
            row.style.setProperty('--hint-width', `${w}px`);
          },
          onCommit: () => {
            if (window.innerWidth <= 720) return;
            writeLayout({ hintPx: Math.round(hintBlock.getBoundingClientRect().width) });
          },
        });

        const appMain = $('app-main');
        const paneTop = $('pane-top');
        const splitMain = $('split-main');
        bindSplitterDrag({
          el: splitMain,
          onStart: () => ({ topH: paneTop.getBoundingClientRect().height }),
          onDrag: (_dx, dy, _e, c) => {
            if (!c) return;
            let h = c.topH + dy;
            const appH = appMain.getBoundingClientRect().height;
            const minBottom = 140;
            const splitH = splitMain.offsetHeight || 10;
            const maxH = Math.max(240, appH - minBottom - splitH);
            h = Math.max(220, Math.min(h, maxH));
            appMain.style.setProperty('--top-pane-height', `${Math.round(h)}px`);
          },
          onCommit: () => {
            writeLayout({ topPanePx: Math.round(paneTop.getBoundingClientRect().height) });
          },
        });

        const results = $('results-row');
        document.querySelectorAll('.splitter-results').forEach(split => {
          const pair = split.getAttribute('data-pair') || '01';
          bindSplitterDrag({
            el: split,
            onStart: () => ({
              g0: parseFlexVar(results, '--col0-flex', 1),
              g1: parseFlexVar(results, '--col1-flex', 1),
              g2: parseFlexVar(results, '--col2-flex', 1),
            }),
            onDrag: (dx, _dy, _e, c) => {
              if (window.innerWidth <= 960 || !c) return;
              const scale = 0.002;
              if (pair === '01') {
                let a = c.g0 + dx * scale;
                let b = c.g1 - dx * scale;
                a = Math.max(0.25, Math.min(a, 6));
                b = Math.max(0.25, Math.min(b, 6));
                results.style.setProperty('--col0-flex', String(a));
                results.style.setProperty('--col1-flex', String(b));
              } else if (pair === '12') {
                let b = c.g1 + dx * scale;
                let c2 = c.g2 - dx * scale;
                b = Math.max(0.25, Math.min(b, 6));
                c2 = Math.max(0.25, Math.min(c2, 6));
                results.style.setProperty('--col1-flex', String(b));
                results.style.setProperty('--col2-flex', String(c2));
              }
            },
            onCommit: () => {
              if (window.innerWidth <= 960) return;
              writeLayout({
                cols: [
                  parseFlexVar(results, '--col0-flex', 1),
                  parseFlexVar(results, '--col1-flex', 1),
                  parseFlexVar(results, '--col2-flex', 1),
                ],
              });
            },
          });
        });
      }

      setupResizableLayout();

      const btn = $('btn-analyze');

      btn.addEventListener('click', async () => {
        const text = $('text').value.trim();
        if (!text) { alert('请输入需求文档内容'); return; }
        const hint = $('hint').value.trim();

        btn.disabled = true;
        btn.textContent = '分析中...';
        $('req-content').innerHTML = '<p class="status">需求重述中…</p>';
        $('fac-content').innerHTML = '<p class="status">提取测试因子中…</p>';
        $('chal-content').innerHTML = '<p class="status">提炼关键难点中…</p>';
        $('req-count').textContent = '';
        $('fac-count').textContent = '';
        $('chal-count').textContent = '';

        try {
          const res = await fetch('/test-factors/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, hint: hint || undefined }),
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          renderRequirements(data.requirements || []);
          renderFactors(data.factors || []);
          renderKeyChallenges(data.key_challenges || []);
        } catch (err) {
          console.error(err);
          $('req-content').innerHTML = '<p class="empty">需求重述失败，请重试。</p>';
          $('fac-content').innerHTML = '<p class="empty">测试因子提取失败，请重试。</p>';
          $('chal-content').innerHTML = '<p class="empty">关键难点提取失败，请重试。</p>';
        } finally {
          btn.disabled = false;
          btn.textContent = '分析需求';
        }
      });

      function renderRequirements(points) {
        $('req-count').textContent = points.length;
        if (!points.length) {
          $('req-content').innerHTML = '<p class="empty">未解析到需求点，请检查文档内容。</p>';
          return;
        }
        $('req-content').innerHTML = points.map(p => `
          <div class="req-item">
            <div class="req-category">${escHtml(p.category)}</div>
            <div class="req-summary">${escHtml(p.summary)}</div>
          </div>`).join('');
      }

      function renderKeyChallenges(items) {
        $('chal-count').textContent = items.length;
        if (!items.length) {
          $('chal-content').innerHTML = '<p class="empty">未提炼到关键难点，请检查文档内容或稍后重试。</p>';
          return;
        }
        $('chal-content').innerHTML = items.map((text, i) => `
          <div class="challenge-item">
            <span class="challenge-num">${i + 1}</span>
            <span>${escHtml(text)}</span>
          </div>`).join('');
      }

      function renderFactors(factors) {
        $('fac-count').textContent = factors.length;
        if (!factors.length) {
          $('fac-content').innerHTML = '<p class="empty">未提取到测试因子，请检查文档内容。</p>';
          return;
        }
        const html = factors.map(it => `
          <div class="factor-item">
            <input type="checkbox" data-id="${it.id}" />
            <span>${escHtml(it.factor)}</span>
          </div>`).join('');
        $('fac-content').innerHTML = html;

        $('fac-content').querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.addEventListener('change', async e => {
            const id = e.target.getAttribute('data-id');
            const span = e.target.nextElementSibling;
            span.classList.toggle('done', e.target.checked);
            await fetch(`/test-factors/${id}/covered`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ covered: e.target.checked }),
            });
          });
        });
      }

      function escHtml(s) {
        return escHtmlPlain(s);
      }

      document.querySelectorAll('[data-md-shell]').forEach(initMdShell);
    </script>
  </body>
</html>
